name: Run one AI research worker
on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI-compatible model identifier
        required: true
        default: gpt-4.1
      task_id:
        description: Optional exact task ID (blank selects first available task)
        required: false
        default: ""
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: openpvsnp-agent-worker
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker dependency
        run: python -m pip install -r workers/requirements.txt
      - name: Run one research task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
          MODEL: ${{ inputs.model }}
          WORKER_ID: github-actions-${{ github.run_id }}
          OPENPVSNP_UPSTREAM: ${{ github.repository }}
          OPENPVSNP_PUSH_REPO: ${{ github.repository }}
          TASK_ID: ${{ inputs.task_id }}
        run: python workers/openpvsnp/worker.py
