name: Lean formalization

on:
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - ".github/workflows/lean-main.yml"
  pull_request:
    paths:
      - "formal/**"
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - ".github/workflows/lean-main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
