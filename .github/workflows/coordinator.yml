name: Refresh research coordination status
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: write
  issues: read
  pull-requests: read
concurrency:
  group: openpvsnp-coordinator
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild status from public GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/coordinator.py
      - name: Commit status snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/project-status.json reports/PROJECT_STATUS.md
          if git diff --cached --quiet; then
            echo "No status changes."
          else
            git commit -m "chore: refresh research coordination status"
            git push
          fi
