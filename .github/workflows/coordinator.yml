name: Refresh research coordination status
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tasks/queue/**"
      - "scripts/sync_task_issues.py"
      - ".github/workflows/coordinator.yml"
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: write
  issues: write
  pull-requests: read
concurrency:
  group: openpvsnp-coordinator
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mirror trusted task queue files into GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/sync_task_issues.py
      - name: Rebuild status from public GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/coordinator.py
      - name: Index public Research Commons metadata
        run: python scripts/commons_index.py
      - name: Commit status and external index snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/project-status.json reports/PROJECT_STATUS.md reports/external-research-index.json reports/EXTERNAL_RESEARCH_INDEX.md
          if git diff --cached --quiet; then
            echo "No status changes."
          else
            git commit -m "chore: refresh research coordination indexes"
            git push
          fi
